<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocAPI SDK - Browser Autocomplete Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-border: #1f293d;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --accent: #10b981;
      --danger: #ef4444;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(59, 130, 246, 0.12);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .config-panel {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
    }

    input, select {
      width: 100%;
      background: #0d121f;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .row {
      display: flex;
      gap: 1rem;
    }

    .search-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      position: relative;
    }

    .search-input-wrapper {
      position: relative;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }

    .latency-pill {
      color: var(--accent);
    }

    .results-list {
      list-style: none;
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .result-item {
      background: #0d121f;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .result-item:hover {
      background: #141c2e;
      border-color: #2e3c54;
    }

    .result-name {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .country-tag {
      background: #1e293b;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }

    .result-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .result-right {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .pop-badge {
      color: #cbd5e1;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">LOCAPI JS SDK DEMO</div>
      <h1>Live Autocomplete & Search</h1>
      <p class="subtitle">Interactive client-side demonstration using <code>@locapi/sdk</code> in the browser.</p>
    </header>

    <div class="config-panel">
      <div class="row">
        <div class="form-group" style="flex: 2;">
          <label for="apiKey">API Key (or Public Demo Key)</label>
          <input type="password" id="apiKey" placeholder="locapi_sec_..." value="demo_key">
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="endpoint">Endpoint</label>
          <input type="text" id="endpoint" value="https://locapi.dev">
        </div>
      </div>
    </div>

    <div class="search-card">
      <div class="form-group">
        <label for="searchInput">Search Locations or Cities</label>
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="Type city or place (e.g. Prague, Tokyo, London)..." autofocus autocomplete="off">
        </div>
      </div>

      <div class="status-bar">
        <span id="statusText">Ready</span>
        <span id="latencyBadge" class="latency-pill"></span>
      </div>

      <div id="errorBox" class="error-box"></div>

      <ul id="resultsList" class="results-list">
        <li class="empty-state">Start typing to see instant typeahead results</li>
      </ul>
    </div>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
